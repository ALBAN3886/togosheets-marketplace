<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Redirection… — TogoSheets Marketplace</title>
<meta name="robots" content="noindex"/>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
        background:#f8fafc; color:#334155; }
  .box{ text-align:center; }
  .spinner{ width:36px; height:36px; border:3px solid #e2e8f0; border-top-color:#16a34a;
            border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  p{ font-size:14px; color:#64748b; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p id="msg">Ouverture de la boutique…</p>
  </div>

  <script type="module">
    // ══════════════════════════════════════════════════════════════════
    // GitHub Pages sert ce fichier (404.html) pour toute URL qui ne
    // correspond à aucun fichier réel du dépôt — ex: /togosheets-marketplace/aetshop
    // On en profite pour transformer ce joli lien en vrai lien de boutique
    // (?tenant=...&store=...) que boutique.html sait déjà lire.
    // ══════════════════════════════════════════════════════════════════
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: 'AIzaSyB5hpkRlFZ9HFRRbpQlvpHwMNDja37Nr2s',
      authDomain: 'gestion-salaire-9d3e9.firebaseapp.com',
      databaseURL: 'https://gestion-salaire-9d3e9-default-rtdb.firebaseio.com',
      projectId: 'gestion-salaire-9d3e9',
      storageBucket: 'gestion-salaire-9d3e9.firebasestorage.app',
      messagingSenderId: '1090226725870',
      appId: '1:1090226725870:web:d16c25eb46397b3f2de4ff',
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const msg = document.getElementById('msg');

    // Le nom de repo ("togosheets-marketplace") fait partie du chemin sur GitHub Pages :
    // /togosheets-marketplace/aetshop → on ne garde que "aetshop".
    const parts = location.pathname.split('/').filter(Boolean); // ex: ["togosheets-marketplace","aetshop"]
    const slug = (parts[parts.length - 1] || '').toLowerCase().trim();

    const REPO_BASE = '/' + (parts[0] || '') + '/';

    (async () => {
      if (!slug) {
        location.replace(REPO_BASE);
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'shop_slugs', slug));
        if (snap.exists()) {
          const { tenantId, storeId } = snap.data();
          const url = REPO_BASE + 'boutique.html?tenant=' + encodeURIComponent(tenantId)
                    + (storeId ? '&store=' + encodeURIComponent(storeId) : '');
          location.replace(url);
        } else {
          msg.textContent = 'Cette boutique n\'existe pas ou plus.';
          setTimeout(() => location.replace(REPO_BASE), 2500);
        }
      } catch (e) {
        msg.textContent = 'Erreur, redirection vers l\'accueil…';
        setTimeout(() => location.replace(REPO_BASE), 2500);
      }
    })();
  </script>
</body>
</html>
